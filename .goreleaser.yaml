checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./dist-extra/*

signs:
  # A detached binary GPG signature (<file>.sig) for checksums.txt and every
  # archive and package. pacman checks package .sig files of exactly this form.
  - &gpg
    id: checksums
    artifacts: checksum
    signature: "${artifact}.sig"
    args:
      - --batch
      - --yes
      - --pinentry-mode
      - loopback
      - -u
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"
    stdin: "{{ .Env.GPG_PASSWORD }}"
  - <<: *gpg
    id: packages
    artifacts: package
  - <<: *gpg
    id: archives
    artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  github:
    owner: orion-belt-dev
    name: orion-belt
  draft: false
  prerelease: auto
  # Installers (install.sh, install.ps1) and the public key that verifies
  # every signature.
  extra_files:
    - glob: ./dist-extra/*
