# Directories the server writes to (see ReadWritePaths in
# orion-belt-server.service). systemd-tmpfiles creates them at boot, which is
# how they get created on image-based systems (rpm-ostree, bootc), where the
# package's post-install script cannot write to /var.
d /var/lib/orion-belt            0750 orionbelt orionbelt -
d /var/lib/orion-belt/recordings 0750 orionbelt orionbelt -
d /var/log/orion-belt            0750 orionbelt orionbelt -
