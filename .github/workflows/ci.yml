name: CI

on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Jobs run on the local gh-local runners while the gh-runners dispatcher keeps
# the GH_RUNS_ON repository variable set, and on GitHub-hosted runners when it
# is unset (dispatcher stopped). Fork pull requests always use hosted runners
# so untrusted code never reaches the local machine.

jobs:
  test:
    name: Test
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # ./cmd/... carries the CLI parity tests: they check that every command
      # pkg/cliparity maps an API route to still exists and still has its
      # flags and help text. Those live in package main, so they only run if
      # cmd is in scope here.
      - name: Unit tests
        run: go test ./pkg/... ./cmd/... ./e2e/...
        env:
          ORION_CVE_E2E: "1"
      # One iteration of every benchmark: too few to time anything, enough to
      # catch a benchmark that no longer builds or panics. The timing gate runs
      # nightly in perf.yml, where the runner noise matters less.
      - name: Benchmark smoke test
        run: go test ./pkg/... -run '^$' -bench . -benchtime=1x

  coverage:
    name: Coverage ratchet
    # Stays on GitHub-hosted runners: the baseline includes the Postgres
    # integration tests, which start a container through testcontainers, and
    # the local runners have no Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Coverage is being raised toward ~80% one package per PR; this only
      # fails when a package drops below what it already achieved.
      - name: Check coverage against baseline
        run: make coverage-check

  ansible:
    name: Ansible e2e
    # GitHub-hosted for the same reason as coverage: the test starts Postgres
    # through testcontainers. The hosted image also ships Ansible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The test skips without Ansible or Docker; here a skip is a failure.
      - name: Ansible through the gateway
        run: |
          ansible --version | head -1
          go test -count=1 -v ./e2e/ansible/ | tee ansible-e2e.log
          grep -q -- '--- PASS: TestAnsibleThroughGateway' ansible-e2e.log

  cve:
    name: Zero CVE gate
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: CVE check
        run: bash scripts/cve-check.sh

  build:
    name: Build
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build
      # The release (.goreleaser.yaml) builds the server and agent for nine
      # Linux CPUs and the clients for every OS. One target per way those
      # break: 32-bit int, ARMv5, big-endian, newer CPUs, each OS's syscalls.
      - name: Cross-compile release platforms
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          for t in 386 arm/5 s390x loong64; do
            GOOS=linux GOARCH=${t%/*} GOARM=$(case $t in arm/*) echo "${t#arm/}" ;; esac) go build -o /dev/null ./cmd/...
          done
          for t in windows/386 darwin/arm64 freebsd/amd64 openbsd/amd64 netbsd/amd64 dragonfly/amd64 illumos/amd64 solaris/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/osh ./cmd/ocp ./cmd/oadmin
          done
