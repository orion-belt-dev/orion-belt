name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    # GitHub-hosted on purpose: packaging needs sudo apt-get, and the
    # multi-arch image build needs QEMU and a Docker daemon. The local runners
    # have neither (no-new-privileges, no Docker socket).
    runs-on: ubuntu-latest
    # Secrets cannot be referenced in `if:` — map them to env first.
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: CVE gate before release
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          bash scripts/cve-check.sh

      - name: Import packaging GPG key
        id: import_gpg
        if: env.GPG_PRIVATE_KEY != ''
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          passphrase: ${{ env.GPG_PASSPHRASE }}

      - name: Export public packaging key
        if: steps.import_gpg.outcome == 'success'
        run: |
          mkdir -p packaging/keys
          FPR="${{ steps.import_gpg.outputs.fingerprint }}"
          echo "$FPR" > packaging/keys/orion-belt.fingerprint
          gpg --armor --export "$FPR" > packaging/keys/orion-belt.asc
          gpg --export "$FPR" > packaging/keys/orion-belt.gpg

      - name: Prepare package signing and release extras
        env:
          FPR: ${{ steps.import_gpg.outputs.fingerprint }}
          APK_RSA_PRIVATE_KEY: ${{ secrets.APK_RSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Installers and the public key ship with every release.
          mkdir -p dist-extra
          cp scripts/install.sh packaging/windows/install.ps1 dist-extra/
          umask 077
          if [ -n "$FPR" ]; then
            cp packaging/keys/orion-belt.asc dist-extra/orion-belt-release-key.asc
            # nfpm signs .deb and .rpm files natively with the release key.
            if printf '%s' "$GPG_PRIVATE_KEY" | grep -q -- '-----BEGIN PGP PRIVATE KEY BLOCK-----'; then
              printf '%s\n' "$GPG_PRIVATE_KEY" >"$RUNNER_TEMP/nfpm-key.asc"
            else
              printf '%s' "$GPG_PRIVATE_KEY" | base64 -d >"$RUNNER_TEMP/nfpm-key.asc"
            fi
            echo "NFPM_KEY_FILE=$RUNNER_TEMP/nfpm-key.asc" >>"$GITHUB_ENV"
          fi
          # apk signatures are RSA: optional; without it the apk index is
          # unsigned and install.sh installs verified release files instead.
          if [ -n "$APK_RSA_PRIVATE_KEY" ]; then
            printf '%s\n' "$APK_RSA_PRIVATE_KEY" >"$RUNNER_TEMP/apk.rsa"
            echo "NFPM_APK_KEY_FILE=$RUNNER_TEMP/apk.rsa" >>"$GITHUB_ENV"
            echo "ORION_APK_PRIVKEY=$RUNNER_TEMP/apk.rsa" >>"$GITHUB_ENV"
          fi

      - name: Select GoReleaser args
        id: goreleaser_args
        run: |
          if [ -n "${{ steps.import_gpg.outputs.fingerprint }}" ]; then
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --clean --skip=sign" >> "$GITHUB_OUTPUT"
            echo "::warning::GPG_PRIVATE_KEY secret not set — publishing unsigned checksums/packages"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.goreleaser_args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSWORD: ${{ env.GPG_PASSPHRASE }}
          NFPM_PASSPHRASE: ${{ env.GPG_PASSPHRASE }}

      - name: Build the package site (pkgs.orion-belt.dev)
        env:
          ORION_PKG_TAG: ${{ github.ref_name }}
          ORION_DIST: dist
          ORION_GPG_KEY: ${{ steps.import_gpg.outputs.fingerprint }}
          ORION_REQUIRE_SIGN: ${{ steps.import_gpg.outputs.fingerprint != '' && '1' || '0' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c
          bash scripts/publish-packages-pages.sh

      - name: Publish the package site (orion-belt-dev/packages)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ORION_PKG_TAG: ${{ github.ref_name }}
          ORION_DIST: dist
          ORION_GPG_KEY: ${{ steps.import_gpg.outputs.fingerprint }}
          ORION_REQUIRE_SIGN: ${{ steps.import_gpg.outputs.fingerprint != '' && '1' || '0' }}
          # Cross-repo push: GITHUB_TOKEN cannot write to another repository.
          # A fine-grained token (contents:write on orion-belt-dev/packages),
          # or an SSH deploy key with write access on it.
          ORION_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          PACKAGES_DEPLOY_KEY: ${{ secrets.PACKAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ORION_PACKAGES_TOKEN:-}" && -z "${PACKAGES_DEPLOY_KEY:-}" ]]; then
            echo "::error::Set the PACKAGES_TOKEN (or PACKAGES_DEPLOY_KEY) secret so the release can publish orion-belt-dev/packages."
            exit 1
          fi
          bash scripts/publish-packages-pages.sh --push

      - name: Upload packages-site artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orion-belt-packages-site
          path: packages-site/
          if-no-files-found: warn

      - name: Remove signing key files
        if: always()
        run: rm -f "$RUNNER_TEMP/nfpm-key.asc" "$RUNNER_TEMP/apk.rsa"

      - name: Set up QEMU (multi-arch images)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          # workflow_dispatch without a tag → latest only
          if [[ "$TAG" == v* ]]; then
            echo "server_tags=ghcr.io/orion-belt-dev/orion-belt-server:${VER},ghcr.io/orion-belt-dev/orion-belt-server:${TAG},ghcr.io/orion-belt-dev/orion-belt-server:latest" >> "$GITHUB_OUTPUT"
            echo "agent_tags=ghcr.io/orion-belt-dev/orion-belt-agent:${VER},ghcr.io/orion-belt-dev/orion-belt-agent:${TAG},ghcr.io/orion-belt-dev/orion-belt-agent:latest" >> "$GITHUB_OUTPUT"
          else
            echo "server_tags=ghcr.io/orion-belt-dev/orion-belt-server:latest" >> "$GITHUB_OUTPUT"
            echo "agent_tags=ghcr.io/orion-belt-dev/orion-belt-agent:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/s390x,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.server_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/orion-belt-dev/orion-belt
            org.opencontainers.image.description=Orion Belt PAM gateway server
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Build and push agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.agent
          target: agent
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/s390x,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.agent_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/orion-belt-dev/orion-belt
            org.opencontainers.image.description=Orion Belt reverse-SSH agent
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
