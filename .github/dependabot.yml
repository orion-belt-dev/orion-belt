version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go_modules:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web/ui
    schedule:
      interval: weekly
    groups:
      npm_and_yarn:
        patterns: ["*"]

  # Actions are pinned by commit SHA; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
