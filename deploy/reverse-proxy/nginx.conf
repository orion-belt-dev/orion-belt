# Orion Belt behind nginx: TLS termination for the web console and HTTP API.
#
# Replace orion.example.com and the certificate paths, then include this file
# from nginx's http {} block (for example /etc/nginx/conf.d/orion-belt.conf).
# Requires nginx 1.25.1 or later for "http2 on".
#
# Matching gateway settings in /etc/orion-belt/server.yaml:
#
#   server:
#     public_url: "https://orion.example.com"
#     trusted_proxies: ["127.0.0.1"]   # the address nginx connects from
#
# SSH (port 2222) is not HTTP and is not proxied here. Publish it directly.
# See docs/REVERSE_PROXY.md.

# Keep upstream connections alive for normal requests and switch to
# "upgrade" only for WebSocket handshakes.
map $http_upgrade $orion_connection {
    default upgrade;
    ""      "";
}

upstream orion_gateway {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name orion.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orion.example.com;

    ssl_certificate     /etc/letsencrypt/live/orion.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orion.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:orion_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The web file browser sends uploads in a single request.
    client_max_body_size 100m;

    # Prometheus metrics are unauthenticated. Scrape them from inside the
    # network on :8080 instead of publishing them.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://orion_gateway;
        proxy_http_version 1.1;

        # The gateway checks that a WebSocket's Origin matches Host, so pass
        # the Host header exactly as the browser sent it, port included.
        proxy_set_header Host $http_host;

        # Replace, rather than append to, any forwarding headers the client
        # sent. Only nginx's view of the peer address is trustworthy.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The web terminal and live session watch use WebSockets. Sessions
        # can sit idle for a long time, so allow an hour between frames.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $orion_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
